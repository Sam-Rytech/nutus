[package]
name = "nutus-factory"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Nutus factory (nutus.near): creates <dao>.nutus.near from global code pinned by hash"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
nutus-common.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
