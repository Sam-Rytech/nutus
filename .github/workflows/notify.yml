name: Notify (testnet)

# Every 15 minutes, asks the bot (a Vercel function on nutus.vercel.app) to
# post new alerts. The bot itself answers commands and settings buttons as
# they arrive; this only drives the clock, since Vercel's free cron is daily.
#
# Setup (once): gh secret set TELEGRAM_BOT_TOKEN   (the same token is set on Vercel)
# The tick key is derived from the token, so there is nothing else to share.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tick
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN is not set; skipping."; exit 0; fi
          KEY=$(printf '%s' "$TOKEN:tick" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          curl -sS --fail-with-body -m 90 -X POST -H "x-tick-key: $KEY" https://nutus.vercel.app/api/tick
