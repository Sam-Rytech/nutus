name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build wasm and ABI
        run: sh scripts/abi.sh
      - name: Upload ABI and wasm
        uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: |
            packages/core/abi/*.json
            target/near/nutus_*/*.wasm
      - name: Check committed ABI is up to date
        run: |
          git add -N packages/core/abi
          if ! git diff --exit-code packages/core/abi; then
            echo "ABI changed. Run scripts/abi.sh (or take the 'contracts' artifact) and commit packages/core/abi"
            exit 1
          fi

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skipped until Builder B adds the first package and pnpm-lock.yaml.
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r lint
      - if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm -r test
