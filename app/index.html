    <style>
      @font-face { font-family: "Public Sans Variable"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/fonts/public-sans-latin.woff2) format("woff2-variations"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/geist-mono-latin-400.woff2) format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-display: swap; font-weight: 500; src: url(/fonts/geist-mono-latin-500.woff2) format("woff2"); }
      html, body { background: #000; margin: 0; }

      /* Loading animation: the mark drops in, then each letter, then the view
         zooms through the gap between the strokes and the page pops out. */
      #intro { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; overflow: hidden; }
      /* Every moving piece is its own HTML element, so the browser can animate it on the compositor
         even while the app's JavaScript is busy starting up. Geometry matches the 420x96 lockup. */
      /* The drawn shapes run from 8 to 414 of 420 units, so nudge left to centre the ink itself, and zoom from that centre. */
      #intro .stage { position: relative; width: min(72vw, 520px); aspect-ratio: 420 / 96; translate: -0.71% 0; transform-origin: 50.71% 50%; will-change: transform, opacity; }
      #intro .mark { position: absolute; left: 0; top: 0; width: 43.81%; height: 100%; }
      #intro .word { position: absolute; left: 48.93%; top: 18.75%; width: 49.69%; height: 61.28%; }
      #intro .p { position: absolute; inset: 0; will-change: transform, opacity; animation: drop 0.75s cubic-bezier(0.34, 1.45, 0.64, 1) both; }
      #intro .p svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #intro .s2 { animation-delay: 0.12s; }
      #intro .l { animation-duration: 0.6s; animation-timing-function: cubic-bezier(0.34, 1.5, 0.64, 1); animation-delay: calc(0.62s + var(--i) * 0.09s); }
      @keyframes drop { from { transform: translateY(-110vh); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
      html:not(.intro):not(.intro-pop) #intro { display: none; }
      html.intro body { overflow: hidden; }
      html.intro #root { opacity: 0; }
      #intro.zoom .stage { animation: zoom 0.85s cubic-bezier(0.55, 0, 0.75, 0.2) forwards; }
      #intro.zoom { animation: clear 0.9s ease-in forwards; }
      @keyframes zoom { 0% { transform: scale(1); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(9); opacity: 0; } }
      @keyframes clear { 0%, 45% { background: #000; } 100% { background: transparent; } }
      html.intro-pop #root { transform-origin: 50% 50vh; animation: pop 0.8s cubic-bezier(0.22, 1.3, 0.36, 1) 0.35s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } html.intro #root { opacity: 1; } }
    </style>
    <script>
      // The intro plays on every full page load (moving between screens isn't one), never with reduced motion.
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) { window.__nutusIntro = "done"; return; }
        document.documentElement.classList.add("intro");
        window.__nutusIntro = "running";
        var start = performance.now(), ready = false, started = false;
        function go() {
          if (started) return;
          started = true;
          var el = document.getElementById("intro");
          var wait = Math.max(0, 1800 - (performance.now() - start)); // the last letter lands at ~1.6 s; let it settle
          setTimeout(function () {
            if (el) el.classList.add("zoom");
            document.documentElement.classList.remove("intro");
            document.documentElement.classList.add("intro-pop");
            setTimeout(function () {
              if (el) el.remove();
              document.documentElement.classList.remove("intro-pop");
              window.__nutusIntro = "done";
              window.dispatchEvent(new Event("nutus:intro-done"));
            }, 1250);
          }, wait);
        }
        window.addEventListener("nutus:ready", function () { ready = true; go(); });
        setTimeout(go, 6000); // never hold the page hostage
      })();
    </script>
