<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Nutus: small DAO payouts go through unless the council objects; recurring pay with guaranteed notice." />
    <title>Nutus</title>
    <link rel="icon" href="/brand/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/brand/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#0E1116" />
    <meta property="og:title" content="Nutus" />
    <meta property="og:description" content="Your DAO pays people even when the council is busy." />
    <meta property="og:image" content="https://nutus.vercel.app/brand/og.png" />
    <meta property="og:url" content="https://nutus.vercel.app" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: "Public Sans Variable"; font-style: normal; font-display: swap; font-weight: 100 900; src: url(/fonts/public-sans-latin.woff2) format("woff2-variations"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-display: swap; font-weight: 400; src: url(/fonts/geist-mono-latin-400.woff2) format("woff2"); }
      @font-face { font-family: "Geist Mono"; font-style: normal; font-display: swap; font-weight: 500; src: url(/fonts/geist-mono-latin-500.woff2) format("woff2"); }
      html, body { background: #000; margin: 0; }

      /* Loading animation: the mark drops in and breathes while the landing's 3D
         loads, then splits: the u flies left, the n flies right, both growing,
         and the page opens up between them. Each stroke is its own HTML layer so
         the browser animates it on the compositor even while the app boots. */
      #intro { position: fixed; inset: 0; z-index: 100; background: #000; display: grid; place-items: center; overflow: hidden; }
      #intro .stage { position: relative; width: min(42vw, 260px); aspect-ratio: 184 / 96; will-change: transform; animation: breathe 2.6s ease-in-out 1s infinite; }
      #intro .p { position: absolute; inset: 0; will-change: transform, opacity; animation: drop 0.8s cubic-bezier(0.34, 1.45, 0.64, 1) both; }
      #intro .p svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #intro .s2 { animation-delay: 0.12s; }
      @keyframes drop { from { transform: translateY(-110vh); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
      @keyframes breathe { 50% { transform: scale(1.035); } }
      html:not(.intro):not(.intro-pop) #intro { display: none; }
      html.intro body { overflow: hidden; }
      html.intro #root { opacity: 0; }
      /* the split: each stroke travels out to its side while the whole mark zooms */
      #intro.split .stage { animation: grow 1.15s cubic-bezier(0.6, 0, 0.75, 0.15) forwards; }
      #intro.split .s1 { animation: go-left 1.15s cubic-bezier(0.6, 0, 0.75, 0.15) forwards; }
      #intro.split .s2 { animation: go-right 1.15s cubic-bezier(0.6, 0, 0.75, 0.15) forwards; }
      #intro.split { animation: clear 1.15s ease-in forwards; }
      @keyframes grow { to { transform: scale(6); } }
      @keyframes go-left { to { transform: translateX(-60%); } }
      @keyframes go-right { to { transform: translateX(60%); } }
      @keyframes clear { 0%, 30% { background: #000; } 100% { background: transparent; } }
      html.intro-pop #root { transform-origin: 50% 50vh; animation: pop 0.9s cubic-bezier(0.22, 1.2, 0.36, 1) 0.25s both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #intro { display: none; } html.intro #root { opacity: 1; } }
    </style>
    <script>
      // Plays on every full page load (moving between screens isn't one), never with reduced motion.
      // It holds until the app has rendered and, on the home page, the 3D ledger has drawn its first
      // frame — that's what the intro is for — with a floor so the drop is seen and a cap so it never hangs.
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) { window.__nutusIntro = "done"; return; }
        document.documentElement.classList.add("intro");
        window.__nutusIntro = "running";
        var start = performance.now(), appReady = false, artReady = false, opened = false;
        var needArt = location.pathname === "/";
        function open() {
          if (opened) return;
          opened = true;
          var el = document.getElementById("intro");
          if (el) el.classList.add("split");
          document.documentElement.classList.remove("intro");
          document.documentElement.classList.add("intro-pop");
          setTimeout(function () {
            if (el) el.remove();
            document.documentElement.classList.remove("intro-pop");
            window.__nutusIntro = "done";
            window.dispatchEvent(new Event("nutus:intro-done"));
          }, 1300);
        }
        function check() {
          if (!opened && appReady && (artReady || !needArt)) setTimeout(open, Math.max(0, 1300 - (performance.now() - start)));
        }
        window.addEventListener("nutus:ready", function () { appReady = true; check(); });
        window.addEventListener("nutus:3d-ready", function () { artReady = true; check(); });
        setTimeout(open, 8000); // never hold the page hostage
      })();
    </script>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="stage"><span class="p s1"><svg viewBox="0 0 184 96"><path d="M14 12L14 60A24 24 0 0 0 57.2 74.4L104 12" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="p s2"><svg viewBox="0 0 184 96"><path d="M80 84L126.8 21.6A24 24 0 0 1 170 36L170 84" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
