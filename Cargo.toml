[workspace]
resolver = "2"
members = [
    "contracts/common",
    "contracts/instance",
    "contracts/factory",
    "contracts/test-token",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Sam-Rytech/nutus"

[workspace.dependencies]
near-sdk = "5"
nutus-common = { path = "contracts/common" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
